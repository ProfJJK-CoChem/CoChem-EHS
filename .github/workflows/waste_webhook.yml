name: Waste Webhook Trigger

on:
  repository_dispatch:
    types: [waste_submitted]
  workflow_dispatch:

jobs:
  process_waste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Waste Processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          WASTE_SHEET_ID: ${{ secrets.WASTE_SHEET_ID }}
          PRINTER_EMAIL: ${{ secrets.PRINTER_EMAIL }}
        run: python src/waste_processor.py --dictation "${{ github.event.client_payload.dictation || 'No dictation provided' }}"
